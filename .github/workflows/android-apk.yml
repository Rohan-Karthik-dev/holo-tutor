# Builds the Holo Tutor Android app (APK) in the cloud, so nobody needs Android Studio.
# Runs on every push to main that touches the app, or by hand from the Actions tab
# ("Build Android APK" → Run workflow). The APK is attached to a GitHub Release
# ("Holo Tutor APK") and to the run's artifacts.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'src/**', 'standalone/**', 'preview/**', 'mobile/**', 'build.py', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Optional repository secret: an Anthropic API key built into the app. When it's set, the APK
      # is published only as a private draft release (visible to the repo's maintainers), because
      # anyone with the file could read the key.
      HOLO_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the web app
        run: python3 build.py

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare the Android project
        working-directory: mobile
        run: |
          npm ci
          node prep.mjs
          npx cap sync android

      - name: Build the APK
        working-directory: mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../HoloTutor.apk

      - uses: actions/upload-artifact@v4
        if: ${{ env.HOLO_API_KEY == '' }}
        with:
          name: HoloTutor-apk
          path: HoloTutor.apk

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$HOLO_API_KEY" ]; then
            gh release create "apk-key-${{ github.run_number }}" HoloTutor.apk --draft \
              --title "Holo Tutor APK with built-in key (private draft, build ${{ github.run_number }})" \
              --notes "PRIVATE: this APK contains the Anthropic API key from the ANTHROPIC_API_KEY secret. Don't share the file or publish this draft. Disable the key in console.anthropic.com when the demo is over."
          else
            gh release create "apk-${{ github.run_number }}" HoloTutor.apk \
              --title "Holo Tutor APK (build ${{ github.run_number }})" \
              --notes "Install on Android: download HoloTutor.apk on the phone, open it, and allow \"Install unknown apps\" when asked. Then open Holo Tutor, choose Study or Fun chat, paste your Anthropic API key once, and allow the microphone."
          fi
