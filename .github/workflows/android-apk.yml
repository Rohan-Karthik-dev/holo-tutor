# Builds the Holo Tutor Android app (APK) in the cloud, so nobody needs Android Studio.
# Runs on every push to main that touches the app, or by hand from the Actions tab
# ("Build Android APK" → Run workflow). The APK is attached to a GitHub Release
# ("Holo Tutor APK") and to the run's artifacts.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'src/**', 'standalone/**', 'preview/**', 'mobile/**', 'build.py', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the web app
        run: python3 build.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - name: Prepare the Android project
        working-directory: mobile
        run: |
          npm ci
          node prep.mjs
          npx cap sync android

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../HoloTutor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HoloTutor-apk
          path: HoloTutor.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Holo Tutor APK (build ${{ github.run_number }})
          body: |
            Install on Android: download HoloTutor.apk on the phone, open it, and allow "Install unknown apps" for your browser or Files app when asked.
            Then open Holo Tutor, choose Study or Fun chat, paste your Anthropic API key once, and allow the microphone.
          files: HoloTutor.apk
